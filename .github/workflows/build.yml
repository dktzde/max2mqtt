name: Build

# Checks every PR and every push to main the way the Supervisor builds the app:
# go vet + tests, then the Dockerfile in max2mqtt/ for both app architectures
# (amd64, aarch64 = linux/arm64), each on a GitHub runner of that architecture (no
# emulation). Each image is loaded and checked. Nothing is pushed or released.
#
# The maintainer has no aarch64 hardware: this build is the only aarch64 test.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: max2mqtt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: max2mqtt/go.mod
          cache-dependency-path: max2mqtt/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  docker:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build app image
        run: docker buildx build max2mqtt --pull --platform ${{ matrix.platform }} --load -t max2mqtt-test:local
      - name: Check image
        run: |
          # version in config.yaml and the io.hass.version label must match
          want=$(grep -oP '^version: "\K[^"]+' max2mqtt/config.yaml)
          got=$(docker image inspect max2mqtt-test:local --format '{{ index .Config.Labels "io.hass.version" }}')
          echo "config.yaml $want, image label $got"
          [ "$want" = "$got" ]
          docker run --rm --platform ${{ matrix.platform }} --entrypoint sh max2mqtt-test:local -c \
            'test -x /app/max2mqtt && test -x /app/run.sh && ls /usr/share/zoneinfo/Europe/Berlin && cat /etc/alpine-release && uname -m'
      - name: Start and stop the bridge
        run: |
          # The binary runs on this architecture: it starts (no broker, no CUL here,
          # both are retried in the background) and stops cleanly on SIGTERM
          docker run -d --name smoke --platform ${{ matrix.platform }} -e MQTT_BROKER=tcp://127.0.0.1:1 max2mqtt-test:local
          sleep 5
          docker stop -t 10 smoke
          docker logs smoke > smoke.log 2>&1
          cat smoke.log
          status=$(docker inspect -f '{{ .State.ExitCode }}' smoke)
          echo "Exit code $status"
          grep -q 'Starting MAX! to MQTT Bridge' smoke.log
          grep -q 'Shutting down' smoke.log
          [ "$status" = 0 ]
